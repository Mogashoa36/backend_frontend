spring.application.name=backend
server.port=8080

# CORS configuration
app.cors.allowed-origins=http://localhost:4200,https://your-production-frontend-domain.com

# Database configuration (use environment variables for production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/backend_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
